<!DOCTYPE html>
<html>

<head>
    <style>
        .effects {
            background-color: yellow;
        }
    </style>
    <title>Reference</title>
    <script type="text/javascript">
        function DeleteClick() {
            x = confirm("Are you sure want to Delete?");
            if (x == true) {
                document.write("Record Deleted");
            } else {
                alert("Canceled..");
            }
        }
    </script>
</head>

<body>
    <button onclick="DeleteClick()">Delete</button>
</body>

</html>
