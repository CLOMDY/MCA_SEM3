<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        h2 {
            text-align: center;
        }

        fieldset {
            border: 2px solid #333;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
        }

        legend {
            font-weight: bold;
        }

        label {
            display: inline-block;
            width: 150px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            padding: 5px;
            width: 200px;
        }

        .room,
        .amenity {
            display: inline-block;
            width: 45%;
            text-align: center;
            margin: 10px;
        }

        .room img,
        .amenity img {
            width: 100px;
            height: 80px;
            display: block;
            margin: auto;
        }

        .button {
            text-align: center;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #bill {
            display: none;
            background: #fff;
            border: 2px solid #333;
            padding: 15px;
        }

        .bill-line {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <h2>Hotel Registration</h2>

    <form id="hotelForm">
        <fieldset>
            <legend>Customer Info</legend>
            <label>Customer Name:</label><input type="text" id="name" required><br>
            <label>Check In Date:</label><input type="date" id="checkin" required><br>
            <label>Total No. of Days:</label><input type="number" id="days" required><br>
            <label>Total No. of People:</label><input type="number" id="people" required>
        </fieldset>

        <fieldset>
            <legend>Room Type</legend>
            <div class="room">
                <img src="https://via.placeholder.com/100x80?text=Deluxe" alt="Deluxe Room">
                <p>2000/day</p>
                <input type="radio" name="room" value="Deluxe" data-price="2000" required> Deluxe Room
            </div>
            <div class="room">
                <img src="https://via.placeholder.com/100x80?text=Suite" alt="Suite Room">
                <p>3000/day</p>
                <input type="radio" name="room" value="Suite" data-price="3000"> Suite Room
            </div>
        </fieldset>

        <fieldset>
            <legend>Amenities</legend>
            <div class="amenity">
                <img src="https://via.placeholder.com/100x80?text=Locker" alt="Locker">
                <p>500/day</p>
                <input type="checkbox" name="amenity" value="Locker" data-price="500"> Locker
            </div>
            <div class="amenity">
                <img src="https://via.placeholder.com/100x80?text=AC" alt="AC">
                <p>1000/day</p>
                <input type="checkbox" name="amenity" value="AC" data-price="1000"> A/C
            </div>
        </fieldset>

        <fieldset>
            <legend>Advance (Mandatory)</legend>
            <input type="number" id="advance" required>
        </fieldset>

        <div class="button">
            <button type="button" onclick="generateBill()">Register</button>
        </div>
    </form>

    <div id="bill">
        <h3>Bill Summary</h3>
        <div id="billContent"></div>
    </div>

    <script>
        function generateBill() {
            const name = document.getElementById("name").value;
            const checkin = document.getElementById("checkin").value;
            const days = parseInt(document.getElementById("days").value);
            const people = parseInt(document.getElementById("people").value);
            const advance = parseInt(document.getElementById("advance").value);

            if (!name || !checkin || !days || !people || !advance) {
                alert("Please fill all mandatory fields.");
                return;
            }

            const room = document.querySelector('input[name="room"]:checked');
            if (!room) {
                alert("Please select a room type.");
                return;
            }

            const roomName = room.value;
            const roomPrice = parseInt(room.getAttribute("data-price"));

            // Calculate room total
            const roomTotal = roomPrice * days * people;

            // Amenities
            const amenities = document.querySelectorAll('input[name="amenity"]:checked');
            let amenitiesList = [];
            let amenityTotal = 0;
            amenities.forEach(a => {
                amenitiesList.push(a.value);
                amenityTotal += parseInt(a.getAttribute("data-price")) * days;
            });

            const total = roomTotal + amenityTotal;
            const balance = total - advance;

            let bill = `
    <div class="bill-line"><b>Customer Name:</b> ${name}</div>
    <div class="bill-line"><b>Check In Date:</b> ${checkin}</div>
    <div class="bill-line"><b>Total No. of Days:</b> ${days}</div>
    <div class="bill-line"><b>Total No. of People:</b> ${people}</div>
    <div class="bill-line"><b>Room Type:</b> ${roomName} (${roomPrice}/day)</div>
    <div class="bill-line"><b>Room Cost:</b> ₹${roomTotal}</div>
    <div class="bill-line"><b>Amenities:</b> ${amenitiesList.length ? amenitiesList.join(", ") : "None"}</div>
    <div class="bill-line"><b>Amenities Cost:</b> ₹${amenityTotal}</div>
    <div class="bill-line"><b>Advance Paid:</b> ₹${advance}</div>
    <hr>
    <div class="bill-line"><b>Total:</b> ₹${total}</div>
    <div class="bill-line"><b>Balance:</b> ₹${balance}</div>
  `;

            document.getElementById("billContent").innerHTML = bill;
            document.getElementById("bill").style.display = "block";
        }
    </script>

</body>

</html>
