<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exeption Handling</title>
    <script>
        function myFunc(){
            var a = 100;
            try{
                document.write("Value of variable a is: " + a);
            }catch (e){
                document.write("Error: " + e.description);
            }finally{
                document.write("<br>Finally block executed.");
            }

        }
    </script>
</head>
<body>
    <p>Click the following to see the result:</p>
    <form>
        <input type = "button" value = "Click Me" onclick = "myFunc()"/>
    </form>
    <p>Error will happen and depending on your browser it will give diffeeerent result.</p>
</body>
</html>
